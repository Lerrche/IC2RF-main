modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="IndustrialCraft2_Refactored.png"
credits="${mod_authors}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[mixin]]
config="ic2.mixins.json"

# Optional integrations: IC2R remains usable when these mods are absent.
[[dependencies."${mod_id}"]]
modId="create"
type="optional"
versionRange="[6.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="curios"
type="optional"
versionRange="[9.5.1+1.21.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="aeronautics"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="sable"
type="optional"
versionRange="[2.0.6,)"
ordering="AFTER"
side="BOTH"
